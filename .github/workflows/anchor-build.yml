name: Anchor Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get install -y libudev-dev
      - run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked
      - run: anchor build